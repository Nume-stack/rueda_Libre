<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Rueda Nocturna</title>
  <desc id="d">Ciclista nocturno con luz frontal sobre la skyline de Medellín. Jueves a sábado.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="600" fill="url(#fondo)"/>

  <!-- Estrellas -->
  <g fill="#FAF6EF" opacity="0.5">
    <circle cx="760" cy="70" r="2"/>
    <circle cx="880" cy="130" r="1.5"/>
    <circle cx="1010" cy="60" r="2"/>
    <circle cx="1240" cy="90" r="1.5"/>
    <circle cx="1480" cy="60" r="2"/>
    <circle cx="1560" cy="150" r="1.5"/>
    <circle cx="700" cy="170" r="1.5"/>
    <circle cx="1130" cy="180" r="1"/>
  </g>

  <!-- Skyline de Medellín (silueta) -->
  <g fill="#0B1426">
    <rect x="860" y="380" width="60" height="125"/>
    <rect x="925" y="320" width="80" height="185"/>
    <rect x="1010" y="350" width="55" height="155"/>
    <rect x="1440" y="340" width="70" height="165"/>
    <rect x="1515" y="290" width="85" height="215"/>
  </g>
  <g fill="#FFD166" opacity="0.7">
    <rect x="945" y="345" width="8" height="12"/>
    <rect x="967" y="345" width="8" height="12"/>
    <rect x="945" y="380" width="8" height="12"/>
    <rect x="985" y="410" width="8" height="12"/>
    <rect x="1030" y="375" width="8" height="12"/>
    <rect x="1460" y="365" width="8" height="12"/>
    <rect x="1535" y="315" width="8" height="12"/>
    <rect x="1560" y="345" width="8" height="12"/>
    <rect x="1535" y="400" width="8" height="12"/>
  </g>

  <!-- Suelo -->
  <rect x="0" y="505" width="1600" height="95" fill="#0B1426"/>

  <!-- Luz frontal: resplandor y haz -->
  <circle cx="1350" cy="255" r="200" fill="url(#luz)"/>
  <polygon points="1362,240 1600,150 1600,400 1362,272" fill="url(#haz)"/>

  <!-- Bicicleta -->
  <g fill="none" stroke="#FAF6EF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1120" cy="430" r="75"/>
    <circle cx="1400" cy="430" r="75"/>
    <path d="M1120 430 L1230 300 L1330 300 L1400 430"/>
    <path d="M1230 300 L1258 430 L1120 430"/>
    <path d="M1230 300 L1210 262"/>
    <path d="M1330 300 L1342 262"/>
    <path d="M1196 262 L1226 262"/>
  </g>
  <!-- Hub de las ruedas -->
  <g fill="#FFD166">
    <circle cx="1120" cy="430" r="6"/>
    <circle cx="1400" cy="430" r="6"/>
  </g>
  <!-- Luz frontal -->
  <circle cx="1352" cy="258" r="14" fill="#FFD166"/>
  <circle cx="1352" cy="258" r="6" fill="#FAF6EF"/>

  <!-- Badge -->
  <rect x="120" y="170" width="320" height="42" rx="21" fill="#FFD166"/>
  <text x="280" y="197" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="18" letter-spacing="2" fill="#14213D">NUEVO · JUEVES A SÁBADO</text>

  <!-- Titular -->
  <text x="120" y="310" font-family="Montserrat, sans-serif" font-weight="800" font-size="104" letter-spacing="-2" fill="#FAF6EF">Rueda</text>
  <text x="120" y="410" font-family="Montserrat, sans-serif" font-weight="800" font-size="104" letter-spacing="-2" fill="#FFD166">Nocturna</text>

  <!-- Subtítulo -->
  <text font-family="Open Sans, sans-serif" font-size="30" fill="#FAF6EF" fill-opacity="0.85">
    <tspan x="120" y="470">Descubre Medellín en bici</tspan>
    <tspan x="120" y="512">cuando se encienden las luces.</tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
