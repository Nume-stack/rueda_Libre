<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna - Prototipo Rueda Libre</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-[#FAF6EF] text-[#5B6470] font-sans antialiased min-h-screen flex flex-col justify-center items-center p-6">


    <main class="max-w-3xl w-full bg-white border border-gray-200 rounded-xl shadow-md p-8 md:p-12">

        <span
            class="inline-block bg-[#F39A2B] text-[#14213D] text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full mb-6">
            Nuevo &middot; Jueves a sábado
        </span>

        <h1 class="text-3xl md:text-5xl font-extrabold text-[#14213D] tracking-tight mb-4">
            Rueda Nocturna
        </h1>

        <p class="text-lg md:text-xl text-[#5B6470] mb-8 leading-relaxed">
            Descubre Medellín en bici cuando se encienden las luces.
        </p>

        <div class="flex flex-wrap gap-6 mb-10 py-4 border-t border-b border-gray-100">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#1E7A4F]"></span>
                <span class="font-bold text-[#14213D]">3 rutas</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-[#1E7A4F]"></span>
                <span class="font-bold text-[#14213D]">Desde $55.000</span>
            </div>
        </div>


        <div>
            <a href="#"
                class="inline-block bg-[#1E7A4F] hover:bg-[#F39A2B] text-white hover:text-[#14213D] font-bold text-base px-8 py-3 rounded-lg shadow-sm transition-all duration-200">
                Inscríbete
            </a>
        </div>

    </main>

</body>

</html>
